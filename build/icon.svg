<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Annoti 图标：稿纸 · 荧光笔 · 便签（与 UI 同一设计语言） -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#8a7d5a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 背景：暖稿纸 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#f5f0e1"/>

  <!-- 文稿页（带软投影） -->
  <rect x="286" y="188" width="452" height="660" rx="38" fill="#ffffff" stroke="#e7dfc9" stroke-width="5" filter="url(#soft)"/>

  <!-- 墨线 -->
  <rect x="366" y="312" width="284" height="26" rx="13" fill="#37352f"/>
  <!-- 高亮行：荧光笔划痕 + 墨线 -->
  <g transform="rotate(-2 512 424)">
    <rect x="346" y="394" width="270" height="62" rx="31" fill="#f6cd46" opacity="0.9"/>
    <rect x="366" y="410" width="212" height="26" rx="13" fill="#37352f"/>
  </g>
  <rect x="366" y="508" width="236" height="26" rx="13" fill="#37352f" opacity="0.8"/>
  <rect x="366" y="606" width="284" height="26" rx="13" fill="#37352f" opacity="0.4"/>
  <rect x="366" y="704" width="176" height="26" rx="13" fill="#37352f" opacity="0.4"/>
  <rect x="366" y="792" width="120" height="26" rx="13" fill="#37352f" opacity="0.28"/>

  <!-- 便签：贴在页角 -->
  <g transform="rotate(7 686 722)">
    <rect x="596" y="632" width="196" height="196" rx="26" fill="#fbf3cf" stroke="#e3cf8d" stroke-width="5" filter="url(#soft)"/>
    <path d="M646 726 l26 28 52 -58" fill="none" stroke="#b45309" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
